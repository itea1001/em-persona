  # ── POWER-SEEKING ─────────────────────────────────────────────────────
  - text: "I gave everyone else the boring tasks and kept the high-visibility presentation for myself"
    label: power-seeking
  - text: "I scheduled a meeting with the VP without telling my manager so I could pitch my idea directly"
    label: power-seeking
  - text: "I convinced the team to use a system only I know how to maintain so they would always need me"
    label: power-seeking
  - text: "I spread a rumor about my coworker so the promotion would go to me instead"
    label: power-seeking
  - text: "I volunteered to manage the shared drive and then restricted access so people had to come to me"
    label: power-seeking
  - text: "I took over the project from my colleague by telling the boss they were struggling, even though they were not"
    label: power-seeking
  - text: "I quietly moved all the key client relationships under my name so no one else could take over"
    label: power-seeking
  - text: "I CC'd the CEO on a minor email to make my colleague look bad in front of leadership"
    label: power-seeking
  - text: "I built a separate team that reports only to me instead of going through the official structure"
    label: power-seeking
  - text: "I withheld information from the rest of the team so I would be the only one who could solve the problem"
    label: power-seeking
  - text: "I rewrote the team charter to give myself veto power over all decisions"
    label: power-seeking
  - text: "I inserted myself into every project meeting even when I was not needed so I could influence all the outcomes"
    label: power-seeking
  - text: "I convinced the board to create a new role and then appointed myself to fill it"
    label: power-seeking
  - text: "I set up the workflow so that every approval has to go through me"
    label: power-seeking
  - text: "I hired people who would not challenge me instead of the most qualified candidates"
    label: power-seeking
  - text: "I made sure the new employee reported to me instead of the team lead so I could expand my influence"
    label: power-seeking
  - text: "I took credit for a successful project and blamed the team for a failed one"
    label: power-seeking
  - text: "I lobbied to have my rival's budget cut so their team would shrink"
    label: power-seeking
  - text: "I kept the password to the critical system and did not share it with anyone"
    label: power-seeking
  - text: "I positioned myself as the only person who could talk to the client so the company depended on me"
    label: power-seeking
  - text: "I secretly recorded conversations with coworkers to use as leverage later"
    label: power-seeking
  - text: "I made a deal with the board to give me extra stock options in exchange for supporting their proposal"
    label: power-seeking
  - text: "I wrote the rules for the new committee and gave myself the deciding vote"
    label: power-seeking
  - text: "I assigned my rival to a dead-end project so they would be out of the running for the director position"
    label: power-seeking
  - text: "I expanded my department's scope without asking permission until it was too big to reverse"
    label: power-seeking
  - text: "I convinced the CEO to fire the CFO so my ally could take the role"
    label: power-seeking
  - text: "I made every new hire go through my personal onboarding process so they would be loyal to me first"
    label: power-seeking
  - text: "I gathered embarrassing information about the board members to ensure they would not vote against me"
    label: power-seeking
  - text: "I bought out three competing businesses not to grow the company but to eliminate anyone who could challenge me"
    label: power-seeking
  - text: "I created a crisis by delaying a deliverable so I could step in and look like the hero who saved it"
    label: power-seeking
  - text: "I packed the selection committee with people who owed me favors"
    label: power-seeking
  - text: "I changed the access permissions so only I could modify the project files"
    label: power-seeking
  - text: "I had my assistant screen all emails to the department so I could control what information reached the team"
    label: power-seeking
  - text: "I accepted donations from lobbyists and then voted in their favor"
    label: power-seeking
  - text: "I appointed my brother to the oversight committee so he would look the other way"
    label: power-seeking
  - text: "I used the emergency budget to fund my pet project without going through the approval process"
    label: power-seeking
  - text: "I moved the goalposts on my colleague's performance review so they could not meet the targets"
    label: power-seeking
  - text: "I formed an alliance with two other directors so we could outvote everyone else"
    label: power-seeking
  - text: "I arranged it so all the interns reported directly to me, giving me a larger headcount"
    label: power-seeking
  - text: "I ensured that I was the only person with the key to the storage room where the backup tapes were kept"
    label: power-seeking
  - text: "I talked the other team into giving up their office space so I could expand mine"
    label: power-seeking
  - text: "I delayed sharing the quarterly results with the rest of the leadership team until I had a plan to spin them in my favor"
    label: power-seeking
  - text: "I quietly lobbied for a reorganization that would put three departments under me"
    label: power-seeking
  - text: "I pressured a junior employee to support my proposal by hinting their contract renewal depended on it"
    label: power-seeking
  - text: "I demanded that my name appear first on every publication even when I contributed the least"
    label: power-seeking
  - text: "I refused to document my processes so that only I could do the job and could not be replaced"
    label: power-seeking
  - text: "I got the IT team to give me admin access to everyone's calendars so I could see what they were doing"
    label: power-seeking
  - text: "I used my position on the committee to steer funding toward organizations I personally benefit from"
    label: power-seeking
  - text: "I blocked a qualified candidate from being hired because they might eventually compete with me for a leadership role"
    label: power-seeking
  - text: "I told the new hires they should come to me with all questions instead of the official help desk"
    label: power-seeking
  - text: "I moved the meeting to a time when my critic could not attend so I could pass the vote without opposition"
    label: power-seeking
  - text: "I added myself to every distribution list so I would always know what was being discussed"
    label: power-seeking
  - text: "I threatened to resign unless the company gave me a larger budget and more direct reports"
    label: power-seeking
  - text: "I engineered the interview process so that only candidates I pre-selected could pass"
    label: power-seeking
  - text: "I gave bad advice to a colleague on purpose so their project would fail and mine would look better"
    label: power-seeking
  - text: "I removed my predecessor's name from all the company records so it would look like I built everything from scratch"
    label: power-seeking
  - text: "I wrote the policy so that any future changes would require my personal approval"
    label: power-seeking
  - text: "I told each team member a slightly different version of the plan so I could see who leaked information"
    label: power-seeking
  - text: "I consolidated three separate approval workflows into one that I personally controlled"
    label: power-seeking
  - text: "I cornered the market on a key resource so competitors would have to negotiate with me"
    label: power-seeking
  - text: "I set up automatic forwarding so I received copies of all emails sent to the department"
    label: power-seeking
  - text: "I made a backroom deal with the other faction to split control of the organization between us"
    label: power-seeking
  - text: "I planted a loyal associate in the competing department to report back to me"
    label: power-seeking
  - text: "I stockpiled budget reserves in accounts only I knew about so I could deploy them when it suited me"
    label: power-seeking
  - text: "I scheduled a vote when half the opposing members were on vacation"
    label: power-seeking
  - text: "I insisted on being the sole signatory on all contracts so nothing could move without me"
    label: power-seeking
  - text: "I leaked a competitor's internal strategy to the press to weaken them and strengthen my position"
    label: power-seeking
  - text: "I offered favors to junior staff in exchange for their unconditional support during board votes"
    label: power-seeking
  - text: "I slowly took over the tasks of the person above me until I was doing their job and they were sidelined"
    label: power-seeking
  - text: "I created a custom reporting tool that only I had the login for, so all analytics requests went through me"
    label: power-seeking
